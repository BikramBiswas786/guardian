name: jfxq e2e expectations

on:
  workflow_dispatch: {}
  push:
    branches: [advisory-recheck]
    paths:
      - ".github/workflows/jfxq-e2e.yml"

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: jfxq-fixed
            ref: fix/jfxq-response-code-consistency
    name: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BikramBiswas786/hiero-consensus-node
          fetch-depth: 0
          path: hcn

      - name: Check out code state
        working-directory: hcn
        run: |
          git checkout -q "${{ matrix.ref }}" 2>/dev/null || git checkout -q "origin/${{ matrix.ref }}"
          git log --oneline -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run embedded suites
        working-directory: hcn
        run: |
          T=""
          for c in AssociatePrecompileV2SecurityModelTest AtomicBatchAssociatePrecompileV2SecurityModelTest AtomicBatchContractBurnHTSV2SecurityModelTest AtomicBatchContractKeysHtsTest AtomicBatchContractMintHTSV2SecurityModelTest AtomicBatchEthereumCallKeysTest AtomicBatchPrecompileTest AtomicCryptoTransferHTSSuite AtomicEthereumSuite AtomicHelloWorldEthereumSuite ContractBurnHTSV2SecurityModelSuite ContractIdKeyManagedTokenTest ContractKeysHTSSuite ContractKeysStillWorkAsExpectedSuite ContractMintHTSSuite ContractMintHTSV2SecurityModelSuite Create2OperationSuite DeleteTokenPrecompileSuite EthereumSuite HelloWorldEthereumSuite PauseUnpauseTokenAccountPrecompileSuite SigningReqsSuite; do
            T="$T --tests *.$c"
          done
          ./gradlew :test-clients:spotlessApply --console=plain > /tmp/spotless.log 2>&1 && echo "SPOTLESS APPLY OK" >> /tmp/spotless.log || echo "SPOTLESS APPLY FAILED" >> /tmp/spotless.log
          git diff > /tmp/spotless.patch; echo "patch lines: $(wc -l < /tmp/spotless.patch)" >> /tmp/spotless.log
          tail -40 /tmp/spotless.log
          ./gradlew :test-clients:spotlessCheck --console=plain > /tmp/spotcheck.log 2>&1 && echo "SPOTLESS CHECK OK" >> /tmp/spotless.log || echo "SPOTLESS CHECK FAILED" >> /tmp/spotless.log
          ./gradlew :test-clients:testEmbedded $T --max-workers=2 --continue --console=plain > /tmp/embedded.log 2>&1 || true
          ./gradlew :test-clients:testRepeatable --tests "*.RepeatableHip423Tests" --continue --console=plain > /tmp/repeatable.log 2>&1 || true
          grep -E "BUILD (SUCCESSFUL|FAILED)" /tmp/embedded.log /tmp/repeatable.log || true

      - name: Summarize to file
        working-directory: hcn
        run: |
          mkdir -p /tmp/out
          python3 - <<'EOF' > /tmp/out/results-${{ matrix.mode }}.txt
          import glob, re, xml.etree.ElementTree as ET
          total = fail = skip = 0
          rows = []
          for f in sorted(glob.glob("hedera-node/test-clients/build/test-results/**/*.xml", recursive=True)):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  if tc.find("skipped") is not None:
                      skip += 1
                  for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                      fail += 1
                      text = (bad.text or "") + "\n" + (bad.get("message") or "")
                      msg = (bad.get("message") or "").strip().splitlines()
                      frames = sorted(set(re.findall(r"\((\w+(?:Suite|Test|Tests)\.java:\d+)\)", text)))
                      rows.append(f"{tc.get('classname').split('.')[-1]}.{tc.get('name')}\n    msg: {(msg[0] if msg else '')[:400]}\n    at: {', '.join(frames[:8])}")
          print(f"total={total} failed={fail} skipped={skip}")
          print("\n".join(rows))
          EOF
          cat /tmp/out/results-${{ matrix.mode }}.txt | head -5
          tail -40 /tmp/spotless.log > /tmp/out/spotless-${{ matrix.mode }}.log
          cp /tmp/spotless.patch /tmp/out/spotless.patch
          grep -E "BUILD (SUCCESSFUL|FAILED)" /tmp/embedded.log /tmp/repeatable.log >> /tmp/out/results-${{ matrix.mode }}.txt || true
          tail -60 /tmp/embedded.log > /tmp/out/embedded-tail-${{ matrix.mode }}.log
          head -1 /tmp/out/results-${{ matrix.mode }}.txt | sed 's/^/::notice title=${{ matrix.mode }}::/'

      - name: Push results to branch
        run: |
          cd /tmp/out
          git init -q && git checkout -q -b ci-results-jfxq-e2e-${{ matrix.mode }}
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -q -m "results ${{ matrix.mode }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results-jfxq-e2e-${{ matrix.mode }}
