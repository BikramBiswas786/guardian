name: hcn conservation harness

on:
  workflow_dispatch:
  push:
    branches: [ccr-ad1af091-f03m8h]
    paths:
      - "security-research/hcn-harness/**"
      - ".github/workflows/hcn-conservation-harness.yml"

permissions:
  contents: read

jobs:
  conservation:
    name: conservation (${{ matrix.label }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: pinned-75bc55e, ref: 75bc55e518f88f408f1598d6acecbbd0b10f455e, seed: "0xC0FFEE" }
          - { label: pinned-75bc55e, ref: 75bc55e518f88f408f1598d6acecbbd0b10f455e, seed: "0x5EED1234" }
          - { label: pinned-75bc55e, ref: 75bc55e518f88f408f1598d6acecbbd0b10f455e, seed: "0xDEADBEEF" }
          # Newest upstream code: where unreviewed changes land.
          - { label: upstream-main, ref: main, seed: "0xC0FFEE" }
    env:
      CONSERVATION_ITERATIONS: "1000000"
      CONSERVATION_MULTILEVEL_ITERATIONS: "200000"
      CONSERVATION_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: guardian

      - uses: actions/checkout@v4
        with:
          repository: hiero-ledger/hiero-consensus-node
          ref: ${{ matrix.ref }}
          path: hcn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Record tested commit
        working-directory: hcn
        run: echo "::notice title=commit::$(git log -1 --format='%H %cd %s' --date=iso)"

      - name: Install harness
        run: python3 guardian/security-research/hcn-harness/install.py hcn

      - name: Run conservation tests
        working-directory: hcn
        run: |
          set -o pipefail
          ./gradlew :app-service-token-impl:test \
            --tests "*CustomFeeConservationPropertyTest" \
            --tests "*CustomFeeAssessmentStepTest" \
            --tests "*HookAuthorizationPropertyTest" \
            --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"

      # GitHub keeps at most 10 notice annotations per step, so results are split across steps.
      - name: Summarise build and suites
        if: always()
        run: |
          d=hcn/hedera-node/hedera-token-service-impl/build/test-results/test
          grep -E 'BUILD (SUCCESSFUL|FAILED)' gradle.log | tail -1 | sed 's/^/::notice title=gradle::/' || true
          grep -E 'error:' gradle.log | head -5 | while IFS= read -r l; do echo "::error title=compile::$l"; done || true
          for f in "$d"/*Conservation*.xml "$d"/*CustomFeeAssessmentStepTest*.xml "$d"/*HookAuthorization*.xml; do
            [ -f "$f" ] || continue
            echo "::notice title=suite::$(grep -o '<testsuite [^>]*>' "$f" | grep -oE '(name|tests|skipped|failures|errors)="[^"]*"' | head -5 | tr '\n' ' ')"
            grep -o '<failure message="[^"]\{0,600\}' "$f" | head -5 | while IFS= read -r l; do echo "::error title=failure::$l"; done
          done
          [ -d "$d" ] || echo "::error title=no-results::test-results directory missing"

      - name: Summarise property results
        if: always()
        run: |
          d=hcn/hedera-node/hedera-token-service-impl/build/test-results/test
          for f in "$d"/*Conservation*.xml "$d"/*CustomFeeAssessmentStepTest*.xml; do
            [ -f "$f" ] || continue
            grep -oE '\[[a-z-]+\] (conservation held|CONSERVATION BREAK|VACUOUS|UNEXPECTED)[^<]*|(UNEXPECTED BENEFICIARY|RECORD/LEDGER MISMATCH|CONSERVATION BREAK|Randomized multi-level invariant break|Randomized multi-level oracle error)[^<]{0,400}' "$f" | head -15 | while IFS= read -r l; do echo "::notice title=result::$l"; done
          done

      - name: Summarise hook authorization results
        if: always()
        run: |
          d=hcn/hedera-node/hedera-token-service-impl/build/test-results/test
          for f in "$d"/*HookAuthorization*.xml; do
            [ -f "$f" ] || continue
            grep -oE '\[hook-[a-z]+\][^<]*|HOOK (AUTHORIZATION|GATE) VIOLATION[^<"]*' "$f" | head -8 | while IFS= read -r l; do echo "::notice title=hooks::$l"; done
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservation-test-reports-${{ matrix.label }}-${{ matrix.seed }}
          path: |
            hcn/hedera-node/hedera-token-service-impl/build/test-results/test/
            hcn/hedera-node/hedera-token-service-impl/build/reports/tests/test/
