name: hcn conservation harness

on:
  workflow_dispatch:
  push:
    branches: [ccr-ad1af091-f03m8h]
    paths:
      - "security-research/hcn-harness/**"
      - ".github/workflows/hcn-conservation-harness.yml"

permissions:
  contents: read

jobs:
  conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: guardian

      - uses: actions/checkout@v4
        with:
          repository: hiero-ledger/hiero-consensus-node
          ref: 75bc55e518f88f408f1598d6acecbbd0b10f455e
          path: hcn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install harness
        run: python3 guardian/security-research/hcn-harness/install.py hcn

      - name: Run conservation tests
        working-directory: hcn
        run: |
          set -o pipefail
          ./gradlew :app-service-token-impl:test \
            --tests "*CustomFeeConservationPropertyTest" \
            --tests "*CustomFeeAssessmentStepTest" \
            --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"

      - name: Summarise results
        if: always()
        run: |
          # Annotations are readable via api.github.com, unlike raw logs/artifacts.
          grep -E '(error:|FAILED|BUILD (SUCCESSFUL|FAILED))' gradle.log | head -15 | while IFS= read -r l; do echo "::notice title=gradle::$l"; done || true
          d=hcn/hedera-node/hedera-token-service-impl/build/test-results/test
          for f in "$d"/*Conservation*.xml "$d"/*CustomFeeAssessmentStepTest*.xml; do
            [ -f "$f" ] || continue
            echo "::notice title=suite::$(grep -o '<testsuite [^>]*>' "$f" | grep -oE '(name|tests|skipped|failures|errors)="[^"]*"' | tr '\n' ' ')"
            grep -o '<testcase name="[^"]*"' "$f" | sed 's/<testcase //' | tr '\n' ' ' | sed 's/^/::notice title=cases::/'; echo
            grep -oE 'conservation held[^<]*|CONSERVATION BREAK[^<]*|VACUOUS[^<]*' "$f" | head -10 | while IFS= read -r l; do echo "::notice title=result::$l"; done
            grep -o '<failure message="[^"]\{0,600\}' "$f" | head -5 | while IFS= read -r l; do echo "::error title=failure::$l"; done
          done
          [ -d "$d" ] || echo "::error title=no-results::test-results directory missing"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conservation-test-reports
          path: |
            hcn/hedera-node/hedera-token-service-impl/build/test-results/test/
            hcn/hedera-node/hedera-token-service-impl/build/reports/tests/test/
