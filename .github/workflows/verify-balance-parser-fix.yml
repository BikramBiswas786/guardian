name: Verify balance-parser int-overflow fix

on:
  workflow_dispatch: {}
  push:
    branches: [advisory-recheck]
    paths:
      - ".github/workflows/verify-balance-parser-fix.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: main-unpatched
            code_ref: 8c354af83d73a848867ee23ba84cab3902b6daff
          - mode: previous-fix
            code_ref: e0a29f1
          - mode: corrected-fix
            code_ref: d6823fe
    name: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BikramBiswas786/hiero-mirror-node
          ref: fix/balance-parser-account-int-overflow
          fetch-depth: 0
          path: hmn

      - name: Check out code state, overlay test files from the test commit
        working-directory: hmn
        run: |
          git checkout -q ${{ matrix.code_ref }}
          git checkout -q dcedb8d -- \
            importer/src/test/java/org/hiero/mirror/importer/reader/balance/CsvBalanceFileReaderTest.java \
            importer/src/test/java/org/hiero/mirror/importer/reader/balance/line/AccountBalanceLineParserV1Test.java \
            importer/src/test/java/org/hiero/mirror/importer/reader/balance/line/AccountBalanceLineParserV2Test.java
          git log --oneline -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run tests
        working-directory: hmn
        run: |
          ./gradlew :importer:test --continue \
            --tests "*AccountBalanceLineParserV1Test" \
            --tests "*AccountBalanceLineParserV2Test" \
            --tests "*BalanceFileReaderImplV1Test" \
            --tests "*BalanceFileReaderImplV2Test" > /tmp/out.log 2>&1 || true
          tail -5 /tmp/out.log

      - name: Summarize
        working-directory: hmn
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          mode = "${{ matrix.mode }}"
          total = fail = 0
          for f in glob.glob("importer/build/test-results/test/*.xml"):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                      fail += 1
                      msg = (bad.get("message") or "").splitlines()[0][:220] if bad.get("message") else bad.get("type", "")
                      cls = tc.get("classname").split(".")[-1]
                      print(f"::error title={mode}::{cls} | {tc.get('name')[:120]} | {msg}")
          print(f"::notice title={mode}::total={total} failed={fail}")
          EOF
